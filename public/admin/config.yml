backend:
  name: github
  repo: bentagami/portfolio   # ← replace with your GitHub username/repo
  branch: main

# Where uploaded media files go
media_folder: "public/images/work"
public_folder: "/images/work"

# Show a live preview when editing
site_url: https://www.bentagami.com   # ← replace with your domain

collections:

  # ── WORK PROJECTS ──────────────────────────────────────
  - name: "work"
    label: "Work"
    label_singular: "Project"
    folder: "src/content/work"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Title",       name: "title",       widget: "string" }
      - { label: "Description", name: "description", widget: "text",     hint: "Short summary shown on the work grid." }
      - { label: "Date",        name: "date",        widget: "datetime", format: "YYYY-MM-DD", date_only: true }
      - label: "Tags"
        name: "tags"
        widget: "list"
        allow_add: true
        hint: "e.g. Branding, Web Design, Print"
      - { label: "Cover Image", name: "image",    widget: "image",   required: false, hint: "Main image shown on the grid and project page." }
      - { label: "Project URL", name: "link",     widget: "string",  required: false, hint: "External link to live project (optional)." }
      - { label: "Featured",    name: "featured", widget: "boolean", default: false,  hint: "Show Featured badge on the grid card." }
      - { label: "Body",        name: "body",     widget: "markdown", hint: "Full project write-up shown on the project page." }

  # ── ABOUT PAGE ─────────────────────────────────────────
  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About Page"
        file: "src/data/about.json"
        fields:
          - { label: "Headline",     name: "headline",     widget: "string" }
          - { label: "Introduction", name: "intro",        widget: "text"   }
          - { label: "Bio",          name: "bio",          widget: "text"   }
          - { label: "Email",        name: "email",        widget: "string" }
          - { label: "Instagram URL",name: "instagram",    widget: "string", required: false }
          - { label: "LinkedIn URL", name: "linkedin",     widget: "string", required: false }
          - label: "Services"
            name: "services"
            widget: "list"
            allow_add: true
          - label: "Clients"
            name: "clients"
            widget: "list"
            allow_add: true
