backend:
  name: github
  repo: your-username/your-repo-name # Replace with your actual repo
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "projects"
    label: "Projects"
    folder: "src/content/projects" # Matches the path in File 4
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Project ID", name: "id", widget: "string", hint: "e.g., #BT-HW-001" }
      - { label: "Year", name: "year", widget: "number" }
      - { label: "Icon (Emoji)", name: "icon", widget: "string", hint: "e.g., ⚙️ or 🌐" }
      - { label: "Handwritten Note", name: "handtag", widget: "string", hint: "e.g., v2.1 or Shipped!" }
      - { label: "Badge", name: "badge", widget: "string", required: false, hint: "e.g., Featured" }
      - { label: "Featured (Orange Border)", name: "featured", widget: "boolean", default: false }
      - { label: "Tags", name: "tags", widget: "list", hint: "e.g., Hardware, Firmware" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Body Content", name: "body", widget: "markdown" }
